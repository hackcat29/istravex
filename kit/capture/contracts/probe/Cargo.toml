[package]
name = "istravex-probe"
version = "1.0.0"
edition = "2021"
publish = false
description = "Tiny Soroban contract the generator uses to put specific ScVal shapes and authorization trees on a standalone network."
license = "Apache-2.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
soroban-sdk = "=29.0.1"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true
