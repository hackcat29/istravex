[package]
name = "istravex-runner"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust conformance runner for the Istravex XDR corpus (stellar-xdr)"

[dependencies]
stellar-xdr = { version = "=30.0.0", default-features = false, features = ["std", "base64", "serde", "serde_json", "arbitrary", "type_enum"] }
stellar-strkey = "=1.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
arbitrary = "1.1.3"
flate2 = "1"
base64 = "0.22"
