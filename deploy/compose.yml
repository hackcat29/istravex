# API + mock RPC on the Contabo VPS, deployed by .github/workflows/deploy.yml
# into /opt/istravex. TAG is the git commit being deployed (written to .env).
name: istravex

services:
  api:
    image: ghcr.io/hackcat29/istravex-api:${TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    expose: ["8080"]
    logging: &logging
      driver: json-file
      options: { max-size: 10m, max-file: "5" }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api: { condition: service_healthy }
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging: *logging

volumes:
  caddy_data:
  caddy_config:
