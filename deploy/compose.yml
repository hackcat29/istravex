# API + mock RPC on the VPS, deployed by .github/workflows/deploy.yml into
# /opt/istravex. TAG is the git commit being deployed (written to .env).
#
# The VPS is shared: the host's nginx terminates TLS for every site and proxies
# api.istravex.com and rpc.istravex.com to this container on 127.0.0.1:3480
# (deploy/nginx/istravex-api.conf). Nothing here binds a public port.
name: istravex

services:
  api:
    image: ghcr.io/hackcat29/istravex-api:${TAG:-latest}
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    ports:
      - "127.0.0.1:3480:8080"
    mem_limit: 512m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "5" }
