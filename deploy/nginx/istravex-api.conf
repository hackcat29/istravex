# api.istravex.com and rpc.istravex.com → the istravex-api container.
# Managed by deploy/remote.sh from the repository; do not edit on the server.
# Certificate: certbot (webroot), cert name "istravex-api", renewed by the
# host's certbot timer with a reload hook.
upstream istravex_api {
    server 127.0.0.1:3480;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.istravex.com rpc.istravex.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Read API: corpus, ledgers, results (server/openapi.json).
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.istravex.com;

    ssl_certificate /etc/letsencrypt/live/istravex-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/istravex-api/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types application/json application/zstd text/plain;

    location / {
        include /opt/istravex/nginx/proxy.inc;
        proxy_pass http://istravex_api;
    }
}

# Mock Stellar RPC: https://rpc.istravex.com/{pubnet,testnet,local}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rpc.istravex.com;

    ssl_certificate /etc/letsencrypt/live/istravex-api/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/istravex-api/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    gzip on;
    gzip_types application/json text/plain;

    location / {
        include /opt/istravex/nginx/proxy.inc;
        # /pubnet → /rpc/pubnet on the API
        proxy_pass http://istravex_api/rpc/;
    }
}
