# Bootstrap config, used only until the TLS certificate exists: serves the
# ACME challenge for certbot and proxies plain HTTP. Installed by
# deploy/remote.sh as /etc/nginx/sites-available/istravex-api.conf.
upstream istravex_api {
    server 127.0.0.1:3480;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.istravex.com rpc.istravex.com;
    # No request logs: Istravex keeps no record of who called it (errors are still logged).
    access_log off;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        include /opt/istravex/nginx/proxy.inc;
        proxy_pass http://istravex_api;
    }
}
