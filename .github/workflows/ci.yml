name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kit:
    name: Corpus, runners and replay
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: kit/go/go.mod
          cache-dependency-path: kit/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kit/runners/rust
      - run: npm ci
      - name: Provenance (schema, sha256, canonical ledgers)
        run: npm run corpus:verify
      - name: Unit tests (mock RPC, bounded memory, data lake, linter)
        run: npm run test:kit
      - name: SDK conformance
        run: npm run corpus:js && npm run corpus:go && npm run corpus:rust
      - name: JavaScript SDK release matrix (upstream fixes fail before, pass after)
        run: npm run corpus:js-matrix
      - name: Python SDK (stellar-sdk, pinned in kit/runners/python/requirements.txt)
        run: npm run setup:python && npm run corpus:python
      - name: Java SDK (java-stellar-sdk; jars from Maven Central, sha256-pinned)
        run: java -version && npm run corpus:java
      - name: stellar-core golden LedgerCloseMeta (--check-lcm data) in all three SDKs
        run: node kit/goldens/fetch.mjs && npm run corpus:goldens
      - name: Replay
        run: npm run corpus:replay
      - name: All results green
        run: node kit/check-results.mjs
      - name: Site data, docs snippets and API spec are up to date
        run: npm run corpus:data && git diff --exit-code -- src/data/corpus.json docs/snippets docs/api-reference/openapi.json
      - name: Hardening guide field table agrees with the corpus
        run: npm run guide:check
      - name: Hardening guide exports for developers.stellar.org
        run: npm run guide:export
      - uses: actions/upload-artifact@v7
        with:
          name: hardening-guide-docusaurus
          path: build/guide

  generate:
    name: Generate on pinned stellar-core (${{ matrix.passphrase }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        passphrase: [standalone, testnet, pubnet]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: kit/go/go.mod
          cache-dependency-path: kit/go/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: kit/runners/rust
      - run: npm ci
      - name: Install stellar-core 30.0.0 (SDF apt, pinned)
        run: |
          curl -fsSL https://apt.stellar.org/SDF.asc | sudo gpg --dearmor -o /usr/share/keyrings/sdf.gpg
          echo "deb [signed-by=/usr/share/keyrings/sdf.gpg] https://apt.stellar.org noble stable" | sudo tee /etc/apt/sources.list.d/sdf.list
          sudo apt-get update -q
          sudo apt-get install -y -q stellar-core=30.0.0-3642.0e49751aa.noble
      # Standalone: the committed corpus, regenerated on Linux, must match it
      # byte for byte (metadata up to stellar-core's change order). Testnet and
      # pubnet passphrases: two generations must match each other.
      - name: Regeneration is reproducible
        run: node kit/capture/generate.mjs --check --passphrase ${{ matrix.passphrase }}
      - name: Regenerate the committed fixtures and run them
        if: matrix.passphrase == 'standalone'
        run: |
          npm run corpus:generate
          npm run corpus:verify && npm run corpus:js && npm run corpus:go && npm run corpus:rust && npm run corpus:replay
          SKIP_GOLDENS=1 node kit/check-results.mjs
      - name: The next protocol (30) generates reproducibly and passes every runner
        if: matrix.passphrase == 'standalone'
        run: |
          node kit/capture/generate.mjs --check --protocol 30
          node kit/capture/generate.mjs --protocol 30 --out "$RUNNER_TEMP/p30"
          (cd kit/go && go run ./cmd/verify "$RUNNER_TEMP/p30" && go run ./cmd/conformance "$RUNNER_TEMP/p30")
          ISTRAVEX_CORPUS="$RUNNER_TEMP/p30" node kit/runners/js/run.mjs
          (cd kit/runners/rust && cargo run --release -q -- "$RUNNER_TEMP/p30")
          ISTRAVEX_CORPUS="$RUNNER_TEMP/p30" node kit/check-results.mjs --runners-only
      - name: Generate under the ${{ matrix.passphrase }} passphrase and run it
        if: matrix.passphrase != 'standalone'
        run: |
          node kit/capture/generate.mjs --passphrase ${{ matrix.passphrase }} --out "$RUNNER_TEMP/corpus"
          (cd kit/go && go run ./cmd/verify "$RUNNER_TEMP/corpus" && go run ./cmd/conformance "$RUNNER_TEMP/corpus")
          ISTRAVEX_CORPUS="$RUNNER_TEMP/corpus" node kit/runners/js/run.mjs
          (cd kit/runners/rust && cargo run --release -q -- "$RUNNER_TEMP/corpus")
          ISTRAVEX_CORPUS="$RUNNER_TEMP/corpus" node kit/check-results.mjs --runners-only

  probe:
    name: Probe contract rebuilds byte for byte
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Build with the pinned toolchain (rust-toolchain.toml)
        working-directory: kit/capture/contracts/probe
        env:
          SOROBAN_SDK_BUILD_SYSTEM_SUPPORTS_SPEC_SHAKING_V2: '1'
        run: cargo build --release --target wasm32v1-none --locked
      - name: Identical to the committed Wasm
        run: |
          sha256sum kit/capture/contracts/probe/target/wasm32v1-none/release/istravex_probe.wasm kit/capture/contracts/probe.wasm
          cmp kit/capture/contracts/probe/target/wasm32v1-none/release/istravex_probe.wasm kit/capture/contracts/probe.wasm

  api:
    name: API tests and container
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx tsc -p tsconfig.server.json
      - run: npm run test:api
      - name: Build image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t istravex-api:ci .
      - name: Container smoke test (read-only, non-root, as in production)
        run: |
          docker run -d --name api --read-only --tmpfs /tmp --cap-drop ALL --security-opt no-new-privileges -p 8080:8080 istravex-api:ci
          for i in $(seq 1 30); do curl -fsS localhost:8080/v1/health && break; sleep 1; done
          curl -fsS localhost:8080/v1/health | grep -q '"version":"${{ github.sha }}"'
          curl -fsS localhost:8080/v1/fixtures/cap27-muxed-payment-pubnet-0001 | grep -q 1764988090084626463
          curl -fsS -X POST localhost:8080/rpc/pubnet -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"getLedgers","params":{"startLedger":65474279,"pagination":{"limit":1}}}' | grep -q '"sequence":65474279'
          test "$(docker inspect -f '{{.State.Health.Status}}' api)" != unhealthy
      - if: failure()
        run: docker logs api || true

  lint-action:
    name: istravex-lint action (self-test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Clean code passes
        uses: ./actions/lint
        with:
          working-directory: kit/go
          packages: ./lint/...
          version: ${{ github.sha }}
      - uses: actions/setup-go@v7
        with:
          go-version-file: kit/go/go.mod
      - name: Self-test module builds
        run: cd kit/go/lint/testdata/selftest && go build ./...
      - name: Known findings fail and are annotated
        id: bad
        continue-on-error: true
        uses: ./actions/lint
        with:
          working-directory: kit/go/lint/testdata/selftest
          version: ${{ github.sha }}
      - name: Expect failure with exactly 6 findings (IX001 ×2, IX002, IX003 ×3)
        run: test "${{ steps.bad.outcome }}" = failure && test "${{ steps.bad.outputs.findings }}" = 6

  pilot:
    name: Upstream pilots (wallet-backend, stellar-etl)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version-file: kit/go/go.mod
          cache-dependency-path: kit/go/go.sum
      - run: npm ci
      # The sightings replay a protocol 28 corpus the pinned core generates.
      - name: Install stellar-core 30.0.0 (SDF apt, pinned)
        run: |
          curl -fsSL https://apt.stellar.org/SDF.asc | sudo gpg --dearmor -o /usr/share/keyrings/sdf.gpg
          echo "deb [signed-by=/usr/share/keyrings/sdf.gpg] https://apt.stellar.org noble stable" | sudo tee /etc/apt/sources.list.d/sdf.list
          sudo apt-get update -q
          sudo apt-get install -y -q stellar-core=30.0.0-3642.0e49751aa.noble
      - name: wallet-backend at main (RPC and data lake), and before and after each upstream fix
        run: npm run pilot:wallet-backend
      - name: stellar-etl, its latest release, through its own transforms
        run: npm run pilot:stellar-etl
      - run: node kit/check-results.mjs

  site:
    name: Site build and e2e
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Cloudflare Worker config is valid (no upload)
        run: npx wrangler deploy --dry-run
      - name: dist/ carries the Cloudflare headers file
        run: test -s dist/_headers
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: test-results
