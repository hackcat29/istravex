name: Deploy

# Ships main after CI passes:
#   site  istravex.com → Cloudflare Workers static assets (wrangler.jsonc)
#   api   api.istravex.com + rpc.istravex.com → the Contabo VPS (deploy/)
# Docs (docs.istravex.com) are deployed by Mintlify's GitHub app, not here.
#
# Repository configuration (Settings → Secrets and variables → Actions):
#   site  secret   CLOUDFLARE_API_TOKEN   ("Edit Cloudflare Workers" template
#                                          plus Zone → DNS → Edit, on istravex.com)
#         variable CLOUDFLARE_ACCOUNT_ID
#         The site step is skipped until the token is set.
#   api   secrets  VPS_HOST (IPv4), VPS_USER, VPS_SSH_KEY, VPS_KNOWN_HOSTS
#         variable DEPLOY_ENABLED=true (job is skipped until set)
#         variable VPS_IPV6            (optional AAAA records)
#         With the Cloudflare token set, the job also upserts the api/rpc
#         DNS records (deploy/dns.mjs).
#         variable CONFIGURE_UFW=true  (optional; see deploy/remote.sh)

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/istravex-api
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  site:
    name: Site → Cloudflare
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    environment:
      name: production-site
      url: https://istravex.com
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Validate Worker config
        run: npx wrangler deploy --dry-run
      - name: Skip (no Cloudflare token yet)
        if: env.HAS_CLOUDFLARE != 'true'
        run: echo "::notice title=Site not deployed::Set the CLOUDFLARE_API_TOKEN secret and CLOUDFLARE_ACCOUNT_ID variable to deploy istravex.com."
      - name: wrangler deploy
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler deploy --message "${SHA}"
      - name: Smoke test
        if: env.HAS_CLOUDFLARE == 'true'
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://istravex.com/ | grep -q '<title>'
          curl -fsS --retry 5 --retry-delay 6 --retry-all-errors -o /dev/null https://istravex.com/llms.txt

  image:
    name: API image → GHCR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          build-args: GIT_SHA=${{ env.SHA }}
          tags: |
            ${{ env.IMAGE }}:${{ env.SHA }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  api:
    name: API → VPS
    needs: [image]
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-24.04
    environment:
      name: production-api
      url: https://api.istravex.com/v1/health
    env:
      HAS_CLOUDFLARE: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - name: DNS (api, rpc → VPS, DNS-only)
        if: env.HAS_CLOUDFLARE == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ZONE: istravex.com
          VPS_IPV4: ${{ secrets.VPS_HOST }}
          VPS_IPV6: ${{ vars.VPS_IPV6 }}
        run: node deploy/dns.mjs
      - name: SSH setup
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host vps\n  HostName %s\n  User %s\n  IdentityFile ~/.ssh/deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n  ConnectTimeout 20\n' \
            "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_USER }}" > ~/.ssh/config
      - name: Copy stack
        run: |
          ssh vps 'mkdir -p /opt/istravex && rm -rf /opt/istravex/site'
          rsync -az deploy/compose.yml deploy/Caddyfile deploy/remote.sh vps:/opt/istravex/
      - name: Start
        run: |
          ssh vps "TAG='${SHA}' GHCR_USER='${{ github.actor }}' GHCR_TOKEN='${{ secrets.GITHUB_TOKEN }}' CONFIGURE_UFW='${{ vars.CONFIGURE_UFW }}' bash /opt/istravex/remote.sh"
      - name: Smoke test
        run: |
          curl -fsS --retry 10 --retry-delay 6 --retry-all-errors https://api.istravex.com/v1/health | tee /dev/stderr | grep -q "\"version\":\"${SHA}\""
          curl -fsS --retry 5 --retry-delay 6 --retry-all-errors -X POST https://rpc.istravex.com/pubnet \
            -H 'content-type: application/json' -d '{"jsonrpc":"2.0","id":1,"method":"getHealth"}' | grep -q '"healthy"'
